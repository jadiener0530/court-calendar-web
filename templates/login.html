<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Court Schedule — Login</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0e18;
    color: #c8d8f0;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .login-card {
    background: #111826;
    border: 1px solid #1e3060;
    border-radius: 10px;
    padding: 40px 48px;
    width: 360px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  }

  .login-logo {
    text-align: center;
    margin-bottom: 28px;
  }

  .login-logo .badge {
    display: inline-block;
    background: #0d1f40;
    border: 2px solid #1e3060;
    border-radius: 50%;
    width: 64px;
    height: 64px;
    line-height: 60px;
    font-size: 28px;
    margin-bottom: 12px;
  }

  .login-logo h1 {
    font-size: 18px;
    font-weight: 700;
    color: #88b0f8;
    letter-spacing: 0.5px;
  }

  .login-logo p {
    font-size: 11px;
    color: #4a5878;
    margin-top: 2px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  label {
    display: block;
    font-size: 11px;
    color: #6888b0;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 6px;
    margin-top: 18px;
  }

  input[type="text"],
  input[type="password"] {
    width: 100%;
    background: #0a0e18;
    border: 1px solid #1e3060;
    border-radius: 5px;
    color: #c8d8f0;
    font-size: 14px;
    padding: 9px 12px;
    outline: none;
    transition: border-color 0.2s;
  }

  input[type="text"]:focus,
  input[type="password"]:focus {
    border-color: #3860b8;
  }

  .error-msg {
    background: #2a0808;
    border: 1px solid #8a1c1c;
    border-radius: 5px;
    color: #ff6b6b;
    font-size: 12px;
    padding: 8px 12px;
    margin-top: 18px;
  }

  .btn-login {
    display: block;
    width: 100%;
    margin-top: 28px;
    background: #1a3878;
    border: 1px solid #2848a0;
    border-radius: 6px;
    color: #c8d8f0;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.5px;
    padding: 11px;
    transition: background 0.2s, border-color 0.2s;
  }

  .btn-login:hover {
    background: #2848a0;
    border-color: #4878c0;
  }

  .footer-note {
    text-align: center;
    font-size: 10px;
    color: #2a3858;
    margin-top: 28px;
  }
</style>
</head>
<body>
<div class="login-card">
  <div class="login-logo">
    <div class="badge">⚖</div>
    <h1>Court Schedule</h1>
    <p>Read-Only Calendar View</p>
  </div>

  <form method="post" autocomplete="off">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autofocus autocomplete="username" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <button type="submit" class="btn-login">Sign In</button>
  </form>

  <div class="footer-note">Sheriff's Office — Authorized Personnel Only</div>
</div>
</body>
</html>
